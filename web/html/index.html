<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧交通Agent系统</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <!-- 主内容区域 -->
        <div class="main-content">
            <div class="header">
                <h1>🚦 智慧交通Agent系统</h1>
                <p>基于YOLO + LSTM + 非线性控制的自适应交通管理系统</p>
            </div>

            <div class="video-container">
                <video id="videoElement" autoplay playsinline></video>
                <div class="video-overlay">
                    <span class="status-indicator status-online" id="cameraStatus"></span>
                    <span id="cameraStatusText">摄像头在线</span>
                    <span style="margin-left: 20px;">📅 <span id="currentTime"></span></span>
                </div>
                <div class="loading" id="videoLoading" style="display: none;">
                    正在启动摄像头...
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="startCamera()">📹 启动摄像头</button>
                <button class="btn btn-danger" onclick="stopCamera()">⏹️ 停止摄像头</button>
                <button class="btn btn-success" onclick="captureSnapshot()">📸 抓拍分析</button>
                <button class="btn btn-primary" onclick="startRealTimeAnalysis()">🔄 实时分析</button>
            </div>
        </div>

        <!-- 右侧信息栏 -->
        <div class="sidebar">
            <!-- 排队长度卡片 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon" style="background: #667eea; color: white;">🚗</div>
                    <div class="card-title">排队长度</div>
                </div>
                <div class="stat-value" id="queueLength">0.0</div>
                <div class="stat-label">米</div>
                <div class="congestion-bar">
                    <div class="congestion-fill" id="congestionBar" style="width: 0%"></div>
                </div>
                <div class="stat-label" style="margin-top: 5px;">车辆数: <span id="vehicleCount">0</span></div>
            </div>

            <!-- 紧急车辆卡片 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon" style="background: #f5576c; color: white;">🚨</div>
                    <div class="card-title">紧急车辆</div>
                </div>
                <div class="stat-value" id="emergencyStatus">无</div>
                <div class="stat-label">检测状态</div>
                <div class="emergency-alert" id="emergencyAlert">
                    ⚠️ 检测到紧急车辆！
                    <div id="emergencyTypes" style="margin-top: 5px; font-size: 14px;"></div>
                </div>
            </div>

            <!-- 信号灯优化卡片 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon" style="background: #4facfe; color: white;">⏱️</div>
                    <div class="card-title">信号灯优化</div>
                </div>
                <div class="signal-timer">
                    <div class="timer-display" id="greenTime">30</div>
                    <div class="timer-label">建议绿灯时间（秒）</div>
                </div>
                <div style="margin-top: 15px;">
                    <div class="stat-label">拥堵等级: <span id="congestionLevel">0.00</span></div>
                    <div class="stat-label">调节因子β: <span id="betaValue">0.000</span></div>
                    <div class="stat-label">预测流量: <span id="predictedFlow">0</span></div>
                </div>
            </div>

            <!-- 天气信息卡片 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon" style="background: #FFC107; color: white;">🌤️</div>
                    <div class="card-title">当前天气</div>
                </div>
                <div class="weather-info">
                    <div class="weather-item">
                        <div class="value" id="temperature">--°C</div>
                        <div class="label">温度</div>
                    </div>
                    <div class="weather-item">
                        <div class="value" id="weather">--</div>
                        <div class="label">天气</div>
                    </div>
                    <div class="weather-item">
                        <div class="value" id="humidity">--%</div>
                        <div class="label">湿度</div>
                    </div>
                    <div class="weather-item">
                        <div class="value" id="wind">--级</div>
                        <div class="label">风力</div>
                    </div>
                </div>
                <div style="margin-top: 10px; font-size: 12px; color: #999; text-align: center;">
                    * 数据来源：高德地图API
                </div>
            </div>

            <!-- 抓拍记录卡片 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon" style="background: #764ba2; color: white;">📷</div>
                    <div class="card-title">抓拍记录</div>
                </div>
                <div class="snapshot-gallery" id="snapshotGallery">
                    <!-- 抓拍图片将在这里显示 -->
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
